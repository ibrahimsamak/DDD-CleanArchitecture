services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: orderflow-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - orderflow-sql-data:/var/opt/mssql
    healthcheck:
      # The API auto-migrates on startup, so wait until SQL actually answers.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  orderflow-sql-data:
